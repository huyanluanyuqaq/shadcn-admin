# ---------------------------------------------------------------------------
# 自动构建并推送 Docker 镜像到 DockerHub
#
# 触发条件：
#   - push 到 main 分支后自动执行（含本工作流自身的首次推送）
#   - 也可在 GitHub Actions 页面手动触发（workflow_dispatch）
#
# 前置配置（在仓库 Settings → Secrets and variables → Actions 中添加）：
#   DOCKERHUB_USERNAME  : 你的 DockerHub 用户名
#   DOCKERHUB_TOKEN     : DockerHub Access Token（需 Read & Write 权限，
#                         在 DockerHub → Account Settings → Security → Access Tokens 生成）
#
# 推送后的镜像：
#   - push 到 main 分支：
#       docker.io/<DOCKERHUB_USERNAME>/subscription-admin:latest
#       docker.io/<DOCKERHUB_USERNAME>/subscription-admin:<短commit-sha>
#   - 推送 Git tag（形如 v1.2.3）：
#       docker.io/<DOCKERHUB_USERNAME>/subscription-admin:v1.2.3
#       docker.io/<DOCKERHUB_USERNAME>/subscription-admin:v1.2
#       docker.io/<DOCKERHUB_USERNAME>/subscription-admin:v1
#
# 多架构：同时构建 linux/amd64 与 linux/arm64（Apple Silicon / ARM 服务器可直接用）。
#
# 注意：镜像构建不需要 JWT_SECRET / ADMIN_PASSWORD（这些是容器运行时变量，
#       由 docker-compose.yml 在 `docker compose up` 时注入）。
# ---------------------------------------------------------------------------

name: Build and Push Docker Image

on:
  push:
    branches: ["main"]
    # 打版本 tag（vX.Y.Z）时发布带版本号的镜像
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# 避免同一分支/同一 tag 的多次推送产生重叠构建
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（多架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx（多架构构建器）
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/subscription-admin
          tags: |
            # 仅默认分支打 latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 提交短 SHA，便于追溯
            type=sha,format=short
            # 打 Git tag（vX.Y.Z）时发布版本号镜像，仅 tag 事件启用
            type=semver,pattern=v{{version}},enable={{is_tag}}
            type=semver,pattern=v{{major}}.{{minor}},enable={{is_tag}}
            type=semver,pattern=v{{major}},enable={{is_tag}}

      - name: Build and push（多架构）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 同时构建 amd64 与 arm64
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 利用 GitHub Actions 缓存层，显著加速重复构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
