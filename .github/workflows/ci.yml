name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# 最小权限：本工作流只读仓库内容，不写任何平台资源（P-06）。
permissions:
  contents: read

jobs:
  install-lint-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 与本地开发环境对齐（本机为 Node 22）。版本不一致会让本地通过、
      # CI 失败（或反之），削弱检查的可信度。
      # v5：v4 仍以 Node 20 为 action 运行时，平台已发弃用告警
      # （实测 warning：「Node.js 20 is deprecated … forced to run on Node.js 24」），
      # 且 v4 在新 runner 上可能出现意外行为。与 actions/checkout 保持同为 v5。
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pnpm
        # 必须锁定版本：pnpm 12 起不再读取 package.json 的 `pnpm` 字段，
        # 且原 onlyBuiltDependencies 列表语法改为 pnpm-workspace.yaml 的
        # allowBuilds 映射语法。不锁版本会让 CI 随 pnpm 发布而突然失败
        # （曾因此报 ERR_PNPM_IGNORED_BUILDS）。
        # 版本与 pnpm-workspace.yaml 的 allowBuilds 写法需配套一致。
        run: npm install -g pnpm@12.10.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @repo/shared 的入口指向 dist/（package.json exports）。server/ 下的测试
      # （notification-format.test.ts 等）经 node_modules 链接解析到该包，
      # dist 缺失时 Vite 依赖扫描失败 → 跳过预打包 → 浏览器测试爆发
      # Invalid hook call（React 多副本）。与本地约定一致：先 build:shared。
      - name: Build shared package
        run: pnpm build:shared

      # 后端（server/）此前从不被 CI 编译：根 tsc -b 的 references 只含
      # tsconfig.app.json / tsconfig.node.json，不含 server/；唯一编译后端的是
      # Dockerfile 的 `pnpm --filter server build`，而 docker.yml 自 2026-10-14 起
      # 已改为 tag-only —— 只有打 tag 时才跑。于是「CI 全绿但后端根本编译不过」
      # 成为一个盲区（TASK-042）。
      # 放此处的理由：① 该脚本自带 @repo/shared build，依赖上一步已产出的 dist；
      # ② fail-fast，排在昂贵的 lint / test / build 之前。
      - name: Typecheck server
        run: pnpm typecheck:server

      - name: Lint the code
        run: pnpm lint

      - name: Analyze unused files and dependencies
        run: pnpm knip

      - name: Run Prettier check
        run: pnpm format:check

      - name: Install browsers
        run: pnpm test:browser:install

      - name: Run tests
        run: pnpm test

      - name: Build the project
        run: pnpm build

  # 仓库级框架一致性审计：只读、无网络、结果确定（scripts/audit-repo.py）。
  # 检查交付请求模板字段、工作流触发与最小权限、占位符与明文密钥、
  # 协作文档引用与链接、以及声明的必需检查名与作业名是否一致。
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # ubuntu-latest 自带 python3；脚本只用标准库，无需 setup-python。
      - name: Run repo framework audit
        run: python3 scripts/audit-repo.py

      # 框架全量自检（shared/scripts/audit_framework.py，A1~A13）。
      # PyYAML 仅 A3 需要（YAML 可解析检查）；ubuntu runner 无预装，故 runtime 安装，
      # 不作为仓库依赖引入（Requirement 8 的 PyYAML 例外）。A3 此前长期 SKIP
      # 形成「看起来检查过、其实跳过」（TASK-047 B5），纳入 CI 后 A3 必须实跑。
      - name: Install PyYAML
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml
      - name: Run workspace framework audit
        run: python3 shared/scripts/audit_framework.py

  # 可追溯性：交付请求内的每个提交必须引用一个**真实存在**的任务（TASK-056 / 审计 F-4a）。
  #
  # 为什么只对 PR 生效：`main` 上已有 83 个缺 `Refs` 的历史提交，追溯它们等于要求改写
  # 已推送历史，属 `.agents/rules/git.md` §6 的受保护操作。判据因此固定为 `base..HEAD`。
  #
  # ★ 本作业**尚未**成为门禁：分支保护的必需检查仍只有 install-lint-build 与 audit。
  #   启用顺序不可颠倒 —— 作业必须先存在于默认分支，再加进必需检查；
  #   否则所有 PR 会永久等待一个不存在的作业，而 `enforce_admins=true` 没有绕过通道。
  #   当前状态以 `docs/operations/github-capability.md` §3 的实测值为准。
  traceability:
    name: traceability
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # ★ 必须检出 PR 的 head 提交，而不是默认的合成合并提交：
          # `pull_request` 事件的默认 ref 是 `refs/pull/<N>/merge`，其提交信息是
          # 「Merge <sha> into <sha>」，永不含 `Refs:` —— 用默认 ref 会让本检查在**每个** PR 上
          # 假红（这是本作业的第一次反向验证就暴露的坑，见 TASK-056 Handoff）。
          ref: ${{ github.event.pull_request.head.sha }}
          # 必须完整历史：浅克隆拿不到 base 的提交，脚本会以退出码 2 拒绝通过（而非静默放过）。
          fetch-depth: 0

      - name: Check task traceability
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: python3 scripts/check-traceability.py --base "$BASE_REF"

  # 端到端冒烟（smoke.ts）：仅对 PR 生效，用 VACUUM INTO 隔离快照库起服务再跑，
  # 绝不写仓库内的真实库。为什么只对 PR：`server/data/app.db` 被 .gitignore 忽略、
  # 不在仓库里，本地冒烟依赖运维手工维护的真实库快照；CI 上无此真实库，故先在
  # 临时目录 `db:migrate` 建一份 schema 起点，再 VACUUM INTO 快照出隔离库运行。
  #
  # ★ 本作业**未**成为门禁：分支保护的必需检查仍只有 install-lint-build 与 audit
  #   （traceability / smoke 均为「仅上报、不阻断」）。启用顺序不可颠倒 ——
  #   作业必须先存在于默认分支并确认稳定上报，再由主控位决定是否入必需检查，
  #   否则所有 PR 会永久等待一个不存在的作业，而 enforce_admins=true 无绕过通道。
  #   当前状态以 docs/operations/github-capability.md §3 的实测值为准。
  #
  # SMOKE_DB_DIR 必须等于快照 .db 所在目录本身（TASK-058 C 簇根因：恢复标记写在
  # 数据库同目录，另设数据目录会让 19.17 在错误位置找不到标记）。
  smoke:
    name: smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@12.10.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm build:shared

      # 先建一份 schema 起点库（CI 无真实库可快照），再 VACUUM INTO 出隔离快照。
      # 快照库目录 = SMOKE_DB_DIR（.db 所在目录本身）。
      - name: Prepare isolated snapshot database
        run: |
          mkdir -p "$SNAP_DIR"
          DATABASE_URL="$SNAP_DIR/base.db" pnpm db:migrate
          node -e "const D=require('better-sqlite3');const s=new D(process.env.SNAP_BASE,{readonly:true});s.exec(\"VACUUM INTO '\"+process.env.SNAP_DB+\"'\");s.close()"
        working-directory: server
        env:
          SNAP_DIR: ${{ runner.temp }}/smoke
          SNAP_BASE: ${{ runner.temp }}/smoke/base.db
          SNAP_DB: ${{ runner.temp }}/smoke/smoke.db

      # 起服务 + 跑 smoke 必须在**同一个 step**：GitHub Actions 每个 step 是独立 shell，
      # 跨 step 的后台进程会被 runner 回收，靠 nohup 无法可靠存活。
      - name: Run smoke test against isolated snapshot
        run: |
          DATABASE_URL="$SNAP_DB" PORT=3000 \
            RESTORE_AUTO_EXIT=false \
            SMOKE_DB_DIR="$SNAP_DIR" \
            ENABLE_SCHEDULER=false \
            TELEGRAM_API_BASE=http://127.0.0.1:3998 \
            FEISHU_API_BASE=http://127.0.0.1:4000 \
            node --import tsx src/index.ts > "$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "server ready after ${i}s"
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "server exited during startup" >&2
              cat "$SERVER_LOG" >&2
              exit 1
            fi
            sleep 1
          done

          SMOKE_BASE_URL=http://localhost:3000 \
            SMOKE_DB_DIR="$SNAP_DIR" \
            node node_modules/tsx/dist/cli.mjs scripts/smoke.ts
        working-directory: server
        env:
          SNAP_DIR: ${{ runner.temp }}/smoke
          SNAP_DB: ${{ runner.temp }}/smoke/smoke.db
          SERVER_LOG: ${{ runner.temp }}/smoke-server.log
