# 依赖更新配置（Dependabot）
#
# 依赖更新同样走交付请求流程，必须通过必需检查后才能合并。
# 分组合并小版本/补丁，避免刷屏；大版本升级由人工评估。
#
# 注意：本仓库使用 pnpm（锁文件在根目录），npm 生态会一并读取 pnpm-lock.yaml。

version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # 工作流与 Action 本身也属于依赖（AC-13：weekly；TASK-047 前实为 monthly，
  # 升高频率以跟紧 actions 弃用告警 —— 见 github-capability.md §7 #7）
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'chore(ci)'

  # 基础镜像更新（Dockerfile 在仓库根目录）
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'chore(docker)'
